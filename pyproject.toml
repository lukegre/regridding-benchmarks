[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "regridding-benchmarks"
version = "0.1.0"
description = "Reproducible geospatial remapping benchmarks"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
regridding-benchmarks = "regridding_benchmarks.cli:entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# The pinned engine locks need Python 3.12; the package itself still installs on 3.11.
environments = ["python_version >= '3.12'"]

[dependency-groups]
# Mirrors requirements-python.lock; uv.lock adds hashes. CI "tiny-adapters" subset:
tiny = [
    "dask==2026.8.0",
    "netcdf4==1.7.5.1.post1",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "xarray==2026.9.0",
    "xarray-regrid==0.4.2",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "regridding-benchmarks"
version = "0.1.0"
description = "Reproducible geospatial remapping benchmarks"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
regridding-benchmarks = "regridding_benchmarks.cli:entry_point"

[tool.setuptools.packages.find]
where = ["src"]
